edition = "2021"
license = "MIT"
description = "Automatic Herdr workspace, tab, pane, and agent names"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
