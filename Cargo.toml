[package]
name = "herdr-pane-name"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["gomin"]
description = "Automatic Herdr workspace, tab, and pane names"
repository = "https://github.com/go-min/herdr-pane-name"
homepage = "https://github.com/go-min/herdr-pane-name"
readme = "README.md"
keywords = ["herdr", "terminal", "plugin", "shell"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
